# Production Docker Compose for Alignia
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#
# Note: The 'deploy.resources' sections only apply when using:
#   - Docker Swarm: docker stack deploy -c docker-compose.prod.yml goals
#   - Compatibility mode: docker compose --compatibility -f docker-compose.prod.yml up
#
# For standard docker compose, resource limits are ignored.

services:
  postgres:
    image: postgres:16-alpine
    container_name: goals-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: goals_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - goals-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d goals_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: goals-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/goals_db
      DB_HOST: postgres
      DB_PORT: 5432
      API_PORT: 3001
      NODE_ENV: production
      ENABLE_SCHEDULER: 'false'
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://alignia.xyz,https://app.alignia.xyz}
      CORS_ALLOW_ALL: ${CORS_ALLOW_ALL:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@alignia.app}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Alignia}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - goals-network
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3001/api/health/live',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: goals-scheduler
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/goals_db
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
      ENABLE_SCHEDULER: 'true'
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@alignia.app}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Alignia}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.alignia.xyz}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - goals-network
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3001/api/health/live',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    container_name: goals-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXT_PUBLIC_APP_URL:-https://app.alignia.xyz}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - goals-network
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.alignia.xyz}
    container_name: goals-marketing
    restart: always
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.alignia.xyz}
      PORT: 3002
      NODE_ENV: production
    networks:
      - goals-network
    expose:
      - '3002'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3002/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: goals-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - web
      - marketing
      - api
    networks:
      - goals-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  goals-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
